# Crear recursos solo despues de revisar planes y recibir autorizacion.
services:
  - type: web
    name: equi-api
    runtime: node
    plan: free
    region: virginia
    repo: https://github.com/Aripe09/equi-api-node-postgres
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --omit=dev --ignore-scripts && npm test
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: equi-postgres-remote
          property: connectionString
      # La URL interna de Render usa certificados autofirmados para TLS.
      - key: DATABASE_SSL_MODE
        value: require
      - key: RUN_MIGRATIONS
        value: "true"
      - key: API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: equi-postgres-remote
    databaseName: equi_db
    user: equi_app
    postgresMajorVersion: "17"
    plan: free
    region: virginia
    ipAllowList: []
